<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>参加予約 - 学園祭なぞ解き</title>
    <link rel="stylesheet" href="css/reservation.css">
</head>
<body>
    <main class="wrap">
        <header class="hero">
            <p class="eyebrow">FESTIVAL PUZZLE EVENT</p>
            <h1>なぞ解き参加予約</h1>
            <p>1組20名まで参加できます。参加日と人数、お名前を入力してください。参加する回は自動で割り振られます。</p>
        </header>

        <section class="panel" aria-labelledby="reservation-heading">
            <h2 id="reservation-heading">予約を申し込む</h2>
            <p class="note">各回の定員は20名です。開催時間は11:00〜16:00（30分ごと）。参加する回は予約確定時にお知らせします。</p>

            <form id="reservationForm">

                <label for="festivalDay">参加日</label>
                <select id="festivalDay" required>
                    <option value="day1">1日目（11月21日）</option>
                    <option value="day2">2日目（11月22日）</option>
                </select>

                <p id="availability" class="availability" role="status"></p>

                <label for="partySize">参加人数（代表者を含む）</label>
                <input
                    id="partySize"
                    type="number"
                    min="1"
                    max="20"
                    step="1"
                    value="1"
                    inputmode="numeric"
                    required
                >

                <label>
                    代表者名
                    <input
                        id="name"
                        type="text"
                        maxlength="80"
                        autocomplete="name"
                        required
                    >
                </label>

                <!-- 同行者の入力欄は人数に応じてJSで生成 -->
                <div id="companionFields" class="field-grid"></div>

                <button class="primary-button" type="submit">
                    予約を確定する
                </button>

                <p id="formFeedback" class="feedback" role="status"></p>
            </form>
        </section>

        <section
            id="numberPanel"
            class="panel result-panel"
            hidden
            aria-live="polite"
        >
            <p class="eyebrow">RESERVATION CONFIRMED</p>

            <h2>予約が完了しました</h2>

            <p>
                当日はこの整理番号と、予約時に入力した代表者名で本人確認を行います。
            </p>

            <div class="assigned-slot">
                <p>参加日：<strong id="reservationDay"></strong></p>
                <p>参加する回：<strong id="reservationSlot"></strong></p>
                <p>参加人数：<strong id="reservationPartySize"></strong></p>
            </div>

            <div class="reservation-names">
                <p>代表者名：<strong id="reservationName"></strong></p>
                <p>同行者名：<strong id="reservationPartnerNames"></strong></p>
            </div>

            <div class="number-box">
                <span>整理番号</span>
                <strong id="reservationNumber"></strong>
            </div>

            <p class="save-warning">
                この画面を写真に撮って担当に見せてください
            </p>
        </section>

        <!--
        <nav class="admin-nav" aria-label="管理者用リンク">
            <a data-admin-link href="index.html">謎解きページへ</a>
            <a data-admin-link href="staff.html">スタッフ用予約確認</a>
        </nav>
        -->
    </main>

    <script src="js/access.js"></script>
    <script src="js/reservation.js"></script>
</body>
</html>
