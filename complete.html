<!-- /complete.html -->
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脱出成功！ - なぞ解き脱出ゲーム</title>
    <link rel="stylesheet" href="css/complete.css">
</head>

<body>

    <!-- ===== 背景（すべて飾り。CSSのみ・外部画像なし） ===== -->
    <div class="scenery" aria-hidden="true">
        <div class="moon"></div>
        <div class="stars"></div>
        <div class="stars stars-2"></div>
        <div class="trees trees-back"></div>
        <div class="trees trees-front"></div>
        <div class="floor"></div>
        <div class="grin"></div>
    </div>

    <!-- 紙吹雪（complete.js が中身を作ります） -->
    <div class="confetti-layer" id="confetti" aria-hidden="true"></div>


    <main class="stage">

        <!-- トランプのエース（ハート）をモチーフにしたカード -->
        <article class="card">

            <span class="corner corner-tl" aria-hidden="true"><b>A</b><i>♥</i></span>
            <span class="corner corner-br" aria-hidden="true"><b>A</b><i>♥</i></span>

            <!-- 金の鍵（押すと紙吹雪がもう一度舞います） -->
            <button class="emblem reveal" type="button" style="--i:0"
                    id="keyButton" aria-label="紙吹雪をもう一度舞わせる">

                <span class="sparkle s1">✦</span>
                <span class="sparkle s2">✦</span>
                <span class="sparkle s3">✦</span>

                <svg viewBox="0 0 140 64" aria-hidden="true" focusable="false">
                    <defs>
                        <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#fff4bd" />
                            <stop offset="0.45" stop-color="#e0b43c" />
                            <stop offset="1" stop-color="#9a7416" />
                        </linearGradient>
                    </defs>

                    <g fill="url(#gold)" stroke="#6b4a0c" stroke-width="1.5" stroke-linejoin="round">
                        <!-- 輪 -->
                        <path fill-rule="evenodd"
                              d="M30 10a22 22 0 1 0 0 44a22 22 0 1 0 0-44zm0 10a12 12 0 1 1 0 24a12 12 0 1 1 0-24z" />
                        <!-- 軸 -->
                        <rect x="50" y="28" width="82" height="9" rx="3" />
                        <rect x="52" y="24" width="6" height="17" rx="2" />
                        <!-- 歯 -->
                        <path d="M108 37h9v14h-9z" />
                        <path d="M121 37h9v10h-9z" />
                    </g>

                    <!-- 輪の中のハート -->
                    <path d="M30 40C21 34 22 26 27 26C29 26 30 28 30 29C30 28 31 26 33 26C38 26 39 34 30 40Z"
                          fill="#b3122a" />
                    <!-- ツヤ -->
                    <path d="M16 24a17 17 0 0 1 12-9" fill="none" stroke="#fffbe0"
                          stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
                    <path d="M60 31h44" fill="none" stroke="#fffbe0"
                          stroke-width="1.6" stroke-linecap="round" opacity="0.7" />
                </svg>
            </button>

            <div class="gummies reveal" style="--i:1" aria-hidden="true">
                <i></i><i></i><i></i><i></i><i></i>
            </div>

            <h1 class="reveal" style="--i:2">
                <span>脱出成功、</span><span>おめでとうございます！</span>
            </h1>

            <div class="drip reveal" style="--i:3" aria-hidden="true"></div>

            <p class="message reveal" style="--i:4">
                <span>すべてのなぞを解き明かしました。</span><br>
                <span>ご参加いただきありがとうございました！</span>
            </p>

            <p class="ending reveal" style="--i:6"><span>めでたし、めでたし。</span></p>

        </article>

    </main>

    <script src="js/complete.js"></script>
</body>

</html>
