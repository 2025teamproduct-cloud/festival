<!-- /room2.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>第2の部屋 - なぞ解き脱出ゲーム</title>
<link rel="preload" as="image" href="img/alice.jpg">
<link rel="stylesheet" href="css/room2.css">
<link rel="stylesheet" href="css/room2-alice.css">
<!-- 表紙画像・あらすじページ用 -->
<link rel="stylesheet" href="css/room2-intro.css">
<!-- 導入ページ・選択式の回答UI用（必ず最後に読み込む） -->
<link rel="stylesheet" href="css/room2-choice.css">
</head>
<body>

<div class="wrap">
  <div class="header">
    <h1>🔐 第2の部屋 ― なぞ解き</h1>
    <!-- <a class="admin-link" data-admin-link href="reservation.html">予約ページへ戻る（管理者）</a> -->
  </div>

  <div class="game-content" id="gameContent">
    <div class="progress" id="progressText">正解数: 0 / 2</div>

    <!--
      本全体

      構成（上から順にめくる）：
      表紙 → q3(問題3：ハリネズミ) → n5(導入：タルト事件) → q4(問題4：真犯人)
           → n6(導入：おまじない) → clear(おまじないを唱える)

      ※ DOM上は「下にあるページほど先に」書く（最後に書いたものが一番上）。
      ※ 文章は js/room2.js の PAGES に書く。ここでは枠だけ用意する。
    -->
    <div class="book-frame pre-start" id="bookFrame">

      <!-- 左ページ（PCのみ表示 / スマホでは非表示） -->
      <div class="book-page-left">
        <div class="page-lines"></div>
        <div class="left-page-content">
          <p class="qtext" id="leftQuestionText">本をタップすると、ここに物語が表示されます。</p>
        </div>
      </div>

      <div class="book-right" id="bookRight">
        <div class="page-lines-right"></div>

        <!-- 一番下：最後のページ（おまじない） -->
        <div class="flip-page paper content-page" data-page="clear">
          <div class="page-inner">
            <div id="clearBox">
              <h2>🎉 全問正解！</h2>
              <p>このおまじないを唱えて<br>元の世界に帰ろう</p>
              <p class="spell">「あなたたちはただのトランプで<br>本の1部だ！」</p>
              <a class="nextlink" href="complete.html">クリア画面へ →</a>
            </div>
          </div>
        </div>

        <!-- 5枚目：導入（おまじない） -->
        <div class="flip-page paper content-page" data-page="n6">
          <div class="page-inner">
            <p class="page-qtext page-story" data-text="n6"></p>
            <div class="story-next">
              <button type="button" class="next-btn">次へ →</button>
            </div>
          </div>
        </div>

        <!-- 4枚目：問題4（真犯人） -->
        <div class="flip-page paper content-page" data-page="q4">
          <div class="page-inner">
            <p class="page-qtext" data-text="q4"></p>
            <div class="question" data-q="q4">
              <div class="choices"></div>
              <div class="qrow">
                <button type="button" class="confirm-btn">確認</button>
              </div>
              <div class="feedback"></div>
            </div>
          </div>
        </div>

        <!-- 3枚目：導入（タルト事件） -->
        <div class="flip-page paper content-page" data-page="n5">
          <div class="page-inner">
            <p class="page-qtext page-story" data-text="n5"></p>
            <div class="story-next">
              <button type="button" class="next-btn">次へ →</button>
            </div>
          </div>
        </div>

        <!-- 2枚目：問題3（ハリネズミ・順番選択） -->
        <div class="flip-page paper content-page" data-page="q3">
          <div class="page-inner">
            <p class="page-qtext" data-text="q3"></p>
            <div class="question" data-q="q3">
              <div class="choices"></div>
              <div class="qrow">
                <button type="button" class="reset-btn">やり直す</button>
                <button type="button" class="confirm-btn">確認</button>
              </div>
              <div class="feedback"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- 表紙（alice.jpg）：合言葉で鍵を開けた後、本をタップすると開く -->
      <div class="flip-page cover" id="bookCover" data-page="cover"
           role="button" tabindex="0" aria-label="本をタップして開く">
        <img class="cover-image" src="img/alice.jpg" alt="不思議の国のアリス" draggable="false">
        <div class="cover-shine"></div>
        <span class="cover-tap">タップして開く</span>
      </div>

    </div>
  </div>
</div>

<!-- 合言葉オーバーレイ：本体の上に重ねて表示。正解でhiddenにする -->
<div id="passwordOverlay">
  <div class="lock-card">
    <div class="icon">🔒</div>
    <h2>合言葉を入力してください</h2>
    <p>スタッフから教えられた合言葉を入力すると、部屋が開きます。</p>
    <input type="text" id="pwInput" placeholder="合言葉">
    <button onclick="checkPassword()">解錠する</button>
    <div class="lock-feedback" id="pwFeedback"></div>
  </div>
</div>

<script src="js/room2.js"></script>
<script src="js/access.js"></script>
</body>
</html>
