<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room 1</title>
    <link rel="stylesheet" href="room1.css">
</head>
<body>

<div class="wrap">
    <header class="header">
        <h1>Room 1</h1>
        <a class="admin-link" href="/">管理画面へ</a>
    </header>

    <main class="game-content">
        <div class="progress" id="progress">問題に挑戦しよう</div>

        <div class="book-frame pre-start" id="bookFrame">

            <section class="book-page-left">
                <div class="page-lines"></div>
                <div class="left-page-content">
                    <p class="qtext" id="leftQuestionText"></p>
                </div>
            </section>

            <section class="book-right" id="bookRight">
                <div class="page-lines-right"></div>

                <div class="flip-page paper content-page" data-page="q1">
                    <div class="page-inner">
                        <div class="question">
                            <div class="qrow">
                                <input type="text" autocomplete="off" aria-label="問題1の答え">
                                <button type="button">回答する</button>
                            </div>
                            <div class="feedback" aria-live="polite"></div>
                        </div>
                    </div>
                </div>

                <div class="flip-page paper content-page" data-page="q2">
                    <div class="page-inner">
                        <div class="question">
                            <div class="qrow">
                                <input type="text" autocomplete="off" aria-label="問題2の答え">
                                <button type="button">回答する</button>
                            </div>
                            <div class="feedback" aria-live="polite"></div>
                        </div>
                    </div>
                </div>

                <div class="flip-page paper content-page" data-page="q3">
                    <div class="page-inner">
                        <div class="question">
                            <div class="qrow">
                                <input type="text" autocomplete="off" aria-label="問題3の答え">
                                <button type="button">回答する</button>
                            </div>
                            <div class="feedback" aria-live="polite"></div>
                        </div>
                    </div>
                </div>

                <div class="flip-page paper content-page" data-page="clear">
                    <div class="page-inner">
                        <div id="clearBox">
                            <h2>全問正解！</h2>
                            <p>スタッフにこの画面を見せて、次の部屋へ進んでください。</p>
                            <a class="nextlink" href="/room2.html">次の部屋へ</a>
                        </div>
                    </div>
                </div>
            </section>

            <div class="flip-page cover" data-page="cover">
                <div class="cover-content">
                    <div class="icon">📖</div>
                    <h2>ゲーム開始前の確認</h2>
                    <p>開始ボタンを押すと、本が開いて問題が表示されます。<br>準備ができたら開始してください。</p>
                    <button id="startButton" type="button">開始する</button>
                </div>
                <div class="cover-shine"></div>
            </div>

        </div>
    </main>
</div>

<script src="room1.js"></script>
</body>
</html>
