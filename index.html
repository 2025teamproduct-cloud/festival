<!-- /index.html -->
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>第1の部屋 - なぞ解き脱出ゲーム</title>

    <link rel="preload" as="image" href="img/hansel.jpg">

    <!--
        あらすじ・問題文用フォント（Google Fonts: Shippori Mincho B1）
        400 = あらすじ本文 / 700 = 問題文（太字）。
        読み込めない環境では Yu Mincho などの明朝体で表示される。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&display=swap">

    <link rel="stylesheet" href="css/room1.css">
    <link rel="stylesheet" href="css/room1-hansel.css">
    <!-- 表紙画像・初回ポップアップ・あらすじページ用 -->
    <link rel="stylesheet" href="css/room1-intro.css">
    <!-- 選択式の回答UI用（必ず最後に読み込む） -->
    <link rel="stylesheet" href="css/room1-choice.css">
</head>

<body>

    <div class="wrap">

        <div class="header">
            <h1>第1の部屋 ― なぞ解き</h1>

            <!-- <a class="admin-link" data-admin-link href="reservation.html">
                予約ページへ戻る（管理者）
            </a> -->
        </div>


        <div class="game-content" id="gameContent">

            <div class="progress" id="progressText">正解数: 0 / 2</div>

            <!--
                本全体

                構成：表紙 → 1ページ目(あらすじ) → 2ページ目(問題1) → 3ページ目(問題2) → クリア

                PC（701px以上）：左ページに文章、右ページに操作欄の見開き
                スマホ（700px以下）：右ページのみの1ページ表示。
                    各ページの上半分に文章(.page-qtext)、
                    下半分に選択肢／ボタンを表示する。
            -->
            <div class="book-frame pre-start" id="bookFrame">


                <!-- 左ページ（PCのみ表示 / スマホでは非表示） -->
                <div class="book-page-left">

                    <div class="page-lines"></div>

                    <div class="left-page-content">
                        <p class="qtext" id="leftQuestionText">
                            本をタップすると、ここに物語が表示されます。
                        </p>
                    </div>

                </div>


                <!-- 右ページ -->
                <div class="book-right" id="bookRight">

                    <div class="page-lines-right"></div>


                    <!-- 一番下：クリアページ -->
                    <div class="flip-page paper content-page" data-page="clear">
                        <div class="page-inner">
                            <div id="clearBox">
                                <h2>🎉 全問正解！</h2>
                                <p>
                                    スタッフにこの画面を見せて、
                                    次の部屋へ進んでください。
                                </p>
                                <a class="nextlink" href="room2.html">
                                    次の部屋へ進む →
                                </a>
                            </div>
                        </div>
                    </div>


                    <!-- 3ページ目：問題2（パンくず） -->
                    <div class="flip-page paper content-page" data-page="q2">
                        <div class="page-inner">

                            <p class="page-qtext" data-qtext="1"></p>

                            <div class="question" data-index="1">
                                <div class="choices"></div>
                                <div class="qrow">
                                    <button type="button" class="confirm-btn" onclick="checkAnswer(1, this)">確認</button>
                                </div>
                                <div class="feedback"></div>
                            </div>

                        </div>
                    </div>


                    <!-- 2ページ目：問題1（石の道） -->
                    <div class="flip-page paper content-page" data-page="q1">
                        <div class="page-inner">

                            <p class="page-qtext" data-qtext="0"></p>

                            <div class="question" data-index="0">
                                <div class="choices"></div>
                                <div class="qrow">
                                    <button type="button" class="confirm-btn" onclick="checkAnswer(0, this)">確認</button>
                                </div>
                                <div class="feedback"></div>
                            </div>

                        </div>
                    </div>


                    <!-- 1ページ目：あらすじ（表紙をめくった後、最初に見えるページ） -->
                    <div class="flip-page paper content-page" data-page="story">
                        <div class="page-inner">

                            <p class="page-qtext page-story" data-story></p>

                            <div class="story-next">
                                <button type="button" id="storyNextButton">問題へ進む →</button>
                            </div>

                        </div>
                    </div>

                </div>


                <!-- 表紙（hansel.jpg）：本をタップすると開く -->
                <div class="flip-page cover" id="bookCover" data-page="cover"
                    role="button" tabindex="0" aria-label="本をタップして開く">

                    <img class="cover-image" src="img/hansel.jpg" alt="ヘンゼルとグレーテル"
                        width="1417" height="2176" draggable="false">

                    <div class="cover-shine"></div>

                    <span class="cover-tap">タップして開く</span>

                </div>

            </div>

        </div>

    </div>


    <!-- 初回アクセス時の案内ポップアップ -->
    <div class="hint-popup" id="hintPopup" role="dialog" aria-modal="true" aria-labelledby="hintTitle" hidden>
        <div class="hint-box">
            <p class="hint-title" id="hintTitle">あそびかた</p>
            <p class="hint-text">
                <strong>本をタップ</strong>して<br>
                進めてください。
            </p>
            <button type="button" id="hintClose">OK</button>
        </div>
    </div>


    <script src="js/room1.js"></script>

    <script src="js/access.js"></script>

</body>

</html>
