<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Room 1</title>

    <link rel="stylesheet" href="room1.css">
</head>

<body>

    <div class="wrap">

        <header class="header">
            <h1>ROOM 1</h1>
        </header>


        <main class="game-content">

            <div class="book-frame pre-start" id="bookFrame">

                <!-- 左ページ -->
                <div class="book-page-left">

                    <div class="page-lines"></div>

                    <div class="left-page-content">
                        <p
                            class="qtext"
                            id="leftQuestionText"
                        ></p>
                    </div>

                </div>


                <!-- 右ページ -->
                <div class="book-right" id="bookRight">

                    <div class="page-lines-right"></div>


                    <!-- 問題1 -->
                    <div
                        class="flip-page paper content-page"
                        data-page="q1"
                    >

                        <div class="page-inner">

                            <h2>問題1</h2>

                            <p>
                                この会場の入口に置かれた看板に書かれた
                                「合言葉」の最初の一文字は何でしょう？
                            </p>

                            <div class="answer-area">

                                <input
                                    type="text"
                                    placeholder="ひらがなで入力"
                                >

                                <button type="button">
                                    回答する
                                </button>

                            </div>

                            <p
                                id="resultMessage"
                                class="feedback"
                            ></p>

                        </div>

                    </div>


                    <!-- 問題2 -->
                    <div
                        class="flip-page paper content-page"
                        data-page="q2"
                    >

                        <div class="page-inner">

                            <h2>問題2</h2>

                            <p>
                                3, 6, 9, 12, ?<br>
                                次に来る数字は？
                            </p>

                            <div class="answer-area">

                                <input
                                    type="text"
                                    placeholder="数字を入力"
                                >

                                <button type="button">
                                    回答する
                                </button>

                            </div>

                        </div>

                    </div>


                    <!-- 問題3 -->
                    <div
                        class="flip-page paper content-page"
                        data-page="q3"
                    >

                        <div class="page-inner">

                            <h2>問題3</h2>

                            <p>
                                「さくら」を逆から読むと？
                            </p>

                            <div class="answer-area">

                                <input
                                    type="text"
                                    placeholder="答えを入力"
                                >

                                <button type="button">
                                    回答する
                                </button>

                            </div>

                        </div>

                    </div>


                    <!-- クリア -->
                    <div
                        class="flip-page paper content-page"
                        data-page="clear"
                    >

                        <div class="page-inner">

                            <h2>クリア</h2>

                            <p>
                                全問正解！
                            </p>

                        </div>

                    </div>

                </div>


                <!--
                    表紙

                    初期状態では右半分だけを覆う。
                -->
                <div
                    class="flip-page cover"
                    data-page="cover"
                >

                    <div class="cover-content">

                        <div class="icon">
                            📖
                        </div>

                        <h2>
                            ゲーム開始前の確認
                        </h2>

                        <p>
                            開始ボタンを押すと、
                            左のページに問題が表示されます。<br>
                            準備ができたら開始してください。
                        </p>

                        <button
                            id="startButton"
                            type="button"
                        >
                            開始する
                        </button>

                    </div>

                    <div class="cover-shine"></div>

                </div>

            </div>

        </main>

    </div>


    <script src="room1.js"></script>

</body>

</html>
