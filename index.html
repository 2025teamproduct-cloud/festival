<!-- /index.html -->
<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>第1の部屋 - なぞ解き脱出ゲーム</title>

    <link rel="preload" as="image" href="img/hansel.jpg">

    <!--
        あらすじ・問題文用フォント（Google Fonts: Shippori Mincho B1）
        400 = あらすじ本文 / 700 = 問題文（太字）。
        読み込めない環境では Yu Mincho などの明朝体で表示される。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700&display=swap">

    <link rel="stylesheet" href="css/room1.css">
    <link rel="stylesheet" href="css/room1-hansel.css">
    <!-- 表紙画像・初回ポップアップ・あらすじページ用 -->
    <link rel="stylesheet" href="css/room1-intro.css">
    <!-- 導入ページ・選択式の回答UI用（必ず最後に読み込む） -->
    <link rel="stylesheet" href="css/room1-choice.css">
</head>

<body>

    <div class="wrap">

        <div class="header">
            <h1>第1の部屋 ― なぞ解き</h1>

            <!-- <a class="admin-link" data-admin-link href="reservation.html">
                予約ページへ戻る（管理者）
            </a> -->
        </div>


        <div class="game-content" id="gameContent">

            <div class="progress" id="progressText">正解数: 0 / 2</div>

            <!--
                本全体

                構成（上から順にめくる）：
                表紙 → story(あらすじ) → n1(導入) → q1(問題1) → n2(導入)
                     → q2(問題2) → n3(導入) → n4(導入) → clear(クリア)

                ※ DOM上は「下にあるページほど先に」書く（最後に書いたものが一番上）。
                ※ 文章は js/room1.js の PAGES に書く。ここでは枠だけ用意する。

                PC（701px以上）：左ページに文章、右ページに操作欄の見開き
                スマホ（700px以下）：右ページのみ。上半分に文章、下半分にボタン／選択肢
            -->
            <div class="book-frame pre-start" id="bookFrame">


                <!-- 左ページ（PCのみ表示 / スマホでは非表示） -->
                <div class="book-page-left">

                    <div class="page-lines"></div>

                    <div class="left-page-content">
                        <p class="qtext" id="leftQuestionText">
                            本をタップすると、ここに物語が表示されます。
                        </p>
                    </div>

                </div>


                <!-- 右ページ -->
                <div class="book-right" id="bookRight">

                    <div class="page-lines-right"></div>


                    <!-- 一番下：クリアページ -->
                    <div class="flip-page paper content-page" data-page="clear">
                        <div class="page-inner">
                            <div id="clearBox">
                                <h2>🎉 全問正解！</h2>
                                <p>
                                    スタッフにこの画面を見せて、
                                </p>
                                <p>
                                    次の部屋へ進んでください。
                                </p>
                                <a class="nextlink" href="room2.html">
                                    次の部屋へ進む →
                                </a>
                            </div>
                        </div>
                    </div>


                    <!-- 8枚目：導入（アリスの世界） -->
                    <div class="flip-page paper content-page" data-page="n4">
                        <div class="page-inner">
                            <p class="page-qtext page-story" data-text="n4"></p>
                            <div class="story-next">
                                <button type="button" class="next-btn">次へ →</button>
                            </div>
                        </div>
                    </div>


                    <!-- 7枚目：導入（お菓子の家） -->
                    <div class="flip-page paper content-page" data-page="n3">
                        <div class="page-inner">
                            <p class="page-qtext page-story" data-text="n3"></p>
                            <div class="story-next">
                                <button type="button" class="next-btn">次へ →</button>
                            </div>
                        </div>
                    </div>


                    <!-- 6枚目：問題2（パンくず） -->
                    <div class="flip-page paper content-page" data-page="q2">
                        <div class="page-inner">
                            <p class="page-qtext" data-text="q2"></p>
                            <div class="question" data-q="q2">
                                <div class="choices"></div>
                                <div class="qrow">
                                    <button type="button" class="confirm-btn">確認</button>
                                </div>
                                <div class="feedback"></div>
                            </div>
                        </div>
                    </div>


                    <!-- 5枚目：導入（パンくず） -->
                    <div class="flip-page paper content-page" data-page="n2">
                        <div class="page-inner">
                            <p class="page-qtext page-story" data-text="n2"></p>
                            <div class="story-next">
                                <button type="button" class="next-btn">次へ →</button>
                            </div>
                        </div>
                    </div>


                    <!-- 4枚目：問題1（分かれ道） -->
                    <div class="flip-page paper content-page" data-page="q1">
                        <div class="page-inner">
                            <p class="page-qtext" data-text="q1"></p>
                            <div class="question" data-q="q1">
                                <div class="choices"></div>
                                <div class="qrow">
                                    <button type="button" class="confirm-btn">確認</button>
                                </div>
                                <div class="feedback"></div>
                            </div>
                        </div>
                    </div>


                    <!-- 3枚目：導入（石ころ・看板） -->
                    <div class="flip-page paper content-page" data-page="n1">
                        <div class="page-inner">
                            <p class="page-qtext page-story" data-text="n1"></p>
                            <div class="story-next">
                                <button type="button" class="next-btn">次へ →</button>
                            </div>
                        </div>
                    </div>


                    <!-- 2枚目：あらすじ（表紙をめくった後、最初に見えるページ） -->
                    <div class="flip-page paper content-page" data-page="story">
                        <div class="page-inner">
                            <p class="page-qtext page-story" data-text="story"></p>
                            <div class="story-next">
                                <button type="button" class="next-btn">次へ →</button>
                            </div>
                        </div>
                    </div>

                </div>


                <!-- 表紙（hansel.jpg）：本をタップすると開く -->
                <div class="flip-page cover" id="bookCover" data-page="cover" role="button" tabindex="0"
                    aria-label="本をタップして開く">

                    <img class="cover-image" src="img/hansel.jpg" alt="ヘンゼルとグレーテル" width="1417" height="2176"
                        draggable="false">

                    <div class="cover-shine"></div>

                    <span class="cover-tap">タップして開く</span>

                </div>

            </div>

        </div>

    </div>


    <!-- 初回アクセス時の案内ポップアップ -->
    <div class="hint-popup" id="hintPopup" role="dialog" aria-modal="true" aria-labelledby="hintTitle" hidden>
        <div class="hint-box">
            <p class="hint-title" id="hintTitle">あそびかた</p>
            <p class="hint-text">
                <strong>本をタップ</strong>して<br>
                進めてください。
            </p>
            <button type="button" id="hintClose">OK</button>
        </div>
    </div>


    <script src="js/room1.js"></script>

    <script src="js/access.js"></script>

</body>

</html>
